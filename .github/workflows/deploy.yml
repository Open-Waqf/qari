name: Deploy Open Waqf Qari

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docs/**'
      - '**/test-images/**'
      # REMOVED *.py and audio extensions so model changes trigger the check
      - '*.txt'

permissions:
  contents: write

jobs:
  # 🛡️ JOB 1: Model & Logic Validation (The Gate)
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # --- Python Setup (For Model Eval) ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caches pip dependencies

      - name: Install Python Deps
        working-directory: ./research
        run: pip install tensorflow librosa numpy scikit-learn

      - name: 🛡️ Run Golden Gate (No-Regression)
        working-directory: ./research
        # This will FAIL the pipeline if accuracy drops below baseline
        run: python evaluate_model.py

  # 🚀 JOB 2: Build & Deploy App (Runs only if Validate passes)
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./app
        run: npm ci

      # Build App
      - name: Build Project
        working-directory: ./app
        run: npm run build

      # Unit Tests
      - name: Run Unit Tests
        working-directory: ./app
        run: npm run test:unit

      # E2E Tests
      - name: Install Playwright Browsers
        working-directory: ./app
        run: npx playwright install --with-deps

      - name: Run Safety Tests (E2E)
        working-directory: ./app
        run: npx playwright test

      # Prepare CNAME
      - name: Copy CNAME
        working-directory: ./app
        run: echo "qari.open-waqf.org" > dist/CNAME

      # Deploy
      - name: Deploy to Deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app/dist
          branch: deploy
          clean: true
          git-config-name: "Open Waqf Bot"
          git-config-email: "bot@open-waqf.org"
          commit-message: "deploy: update Qari (automated)"